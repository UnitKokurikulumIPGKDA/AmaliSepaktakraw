<!DOCTYPE html>
<html lang="ms" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Pemarkahan Futsal MPU3421</title>
  
  <!-- Font Moden: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: { brand: '#4f46e5', accent: '#ec4899' },
          animation: { 'gradient-x': 'gradient-x 15s ease infinite' },
          keyframes: {
            'gradient-x': {
              '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
              '50%': { 'background-size': '200% 200%', 'background-position': 'right center' }
            }
          }
        } 
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .view-transition { transition: opacity 0.5s ease, transform 0.5s ease; }
    .hidden-view { display: none !important; opacity: 0; transform: translateY(20px); }
    .floating-bar { padding-bottom: env(safe-area-inset-bottom); }
    
    /* GLASSMORPHISM UTILITIES */
    .glass-panel {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<!-- Latar Belakang Warna Bertenaga (Vibrant Animated Gradient) -->
<body class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 animate-gradient-x text-slate-800 antialiased min-h-screen relative pb-32 selection:bg-accent selection:text-white">

  <!-- AppBar Glassmorphism -->
  <header class="glass-panel sticky top-0 z-40 px-5 py-4 flex justify-between items-center transition-all rounded-b-3xl">
    <div class="flex items-center gap-3">
      <div class="bg-gradient-to-tr from-brand to-accent text-white w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm shadow-lg">FT</div>
      <h1 class="font-extrabold text-slate-900 tracking-tight text-xl">FUTSAL MPU3421</h1>
    </div>
    <div id="user-info" class="hidden-view flex items-center gap-2">
      <span id="user-label" class="text-xs font-bold text-brand bg-white/80 px-3 py-1.5 rounded-full shadow-sm"></span>
      <button onclick="app.logout()" class="text-sm font-bold text-rose-600 hover:text-white hover:bg-rose-500 bg-white/80 px-3 py-1.5 rounded-full transition-all shadow-sm">Keluar</button>
    </div>
  </header>

  <!-- Overlay Loading -->
  <div id="loader" class="hidden-view fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex flex-col justify-center items-center transition-all duration-300">
    <div class="w-14 h-14 border-4 border-white/30 border-t-accent rounded-full animate-spin mb-4 shadow-xl"></div>
    <p class="font-bold text-white tracking-widest text-sm uppercase">Menyegerak Data...</p>
  </div>

  <main class="max-w-xl mx-auto px-4 mt-8">
    
    <!-- ================= PANDANGAN 1: LOG MASUK ================= -->
    <div id="view-login" class="view-transition">
      <div class="text-center mb-10 mt-6 text-white">
        <h2 class="text-4xl font-black mb-2 drop-shadow-md">Sistem Penilaian</h2>
        <p class="text-white/80 text-sm font-medium">Log masuk untuk memulakan pentaksiran.</p>
      </div>
      
      <div class="glass-panel p-2 rounded-3xl mb-8 flex relative shadow-xl">
        <button id="tab-pelajar" onclick="app.setModLogin('PELAJAR')" class="flex-1 py-3.5 text-sm font-bold rounded-2xl bg-white text-brand shadow transition-all z-10">Pelajar</button>
        <button id="tab-penilai" onclick="app.setModLogin('PENILAI')" class="flex-1 py-3.5 text-sm font-bold rounded-2xl text-slate-600 hover:text-slate-900 transition-all z-10">Kakitangan</button>
      </div>

      <div class="glass-panel p-8 rounded-[2.5rem]">
        <div id="form-pelajar" class="space-y-6">
          <div>
            <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Kad Pengenalan</label>
            <input type="number" id="nokp-input" class="w-full glass-input rounded-2xl px-5 py-4 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-brand focus:bg-white transition-all placeholder:font-medium placeholder:text-slate-400" placeholder="Cth: 010101141234">
          </div>
          <button onclick="app.loginPelajar()" class="w-full bg-gradient-to-r from-brand to-accent hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">Log Masuk</button>
        </div>

        <div id="form-penilai" class="hidden-view space-y-6">
          <div>
            <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Peranan</label>
            <select id="login-role" class="w-full glass-input rounded-2xl px-5 py-4 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-brand focus:bg-white appearance-none transition-all">
              <option value="P1">Penilai 1</option>
              <option value="P2">Penilai 2</option>
              <option value="PENSYARAH">Penyelaras</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">PIN Keselamatan</label>
            <input type="password" id="login-pin" class="w-full glass-input rounded-2xl px-5 py-4 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-brand focus:bg-white transition-all placeholder:font-medium placeholder:text-slate-400" placeholder="****">
          </div>
          <button onclick="app.loginKakitangan()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-xl transition-transform active:scale-95 text-lg">Akses Portal</button>
        </div>
      </div>
    </div>

    <!-- ================= PANDANGAN 2: SENARAI PELAJAR ================= -->
    <div id="view-penilai" class="hidden-view view-transition">
      <h2 class="text-3xl font-black text-white mb-6 drop-shadow-md">Calon Futsal</h2>
      <div id="student-list-container" class="space-y-5">
        <!-- Kad pelajar dijana secara dinamik -->
      </div>
    </div>

    <!-- ================= PANDANGAN 3: BORANG RUBRIK (GLASSMORPHISM) ================= -->
    <div id="view-borang" class="hidden-view view-transition">
      <button onclick="app.showView('view-penilai')" class="mb-6 text-sm font-bold text-white/90 hover:text-white flex items-center gap-1.5 glass-panel py-2 px-5 rounded-full w-fit transition-all active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg> Kembali
      </button>
      
      <div class="glass-panel p-6 rounded-[2.5rem] mb-8 flex items-center gap-5">
        <div class="w-14 h-14 bg-gradient-to-br from-brand to-accent rounded-full flex items-center justify-center text-white shadow-inner">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        <div>
          <p class="text-xs font-black text-brand uppercase tracking-widest mb-1">Penilaian Aktif</p>
          <h2 id="borang-subtitle" class="font-extrabold text-slate-900 text-xl leading-tight"></h2>
        </div>
      </div>

      <div id="rubrik-container" class="space-y-8 pb-10"></div>

      <!-- Floating Bar -->
      <div class="fixed bottom-0 left-0 right-0 z-30 pointer-events-none floating-bar">
        <div class="max-w-xl mx-auto pointer-events-auto px-4 pb-6 pt-10 bg-gradient-to-t from-slate-900/80 via-slate-900/50 to-transparent">
          <div class="glass-panel p-3 rounded-[2.5rem] shadow-2xl flex justify-between items-center border border-white/20 bg-slate-900/80 backdrop-blur-xl">
            <div class="pl-6 py-2">
              <p class="text-white/60 text-[11px] font-black uppercase tracking-widest mb-0.5">Jumlah Markah</p>
              <div class="font-black text-white text-3xl leading-none flex items-baseline gap-1">
                <span id="borang-total">0.0</span><span class="text-base font-semibold text-white/50">/50</span>
              </div>
            </div>
            <button onclick="app.simpanPenilaian()" class="bg-gradient-to-r from-emerald-400 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 text-white font-extrabold py-4 px-10 rounded-full shadow-lg shadow-emerald-500/30 transition-transform active:scale-95 text-lg">Hantar</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    /**
     * KONFIGURASI RUBRIK FUTSAL MPU3421
     */
    const CONFIG_KURSUS = {
      // GANTIKAN URL ANDA DI SINI
      API_URL: 'https://script.google.com/macros/s/AKfycbxIQMBSVJ5xAKBuNlArTkLw5C5-yCaRCHv_g3tug4F4lcphiX8eRMsF0rEILivZzX2A4A/exec',
      tahapList: [
        { id: 'amat_cemerlang', nama: 'Amat Cemerlang', min: 9.0, max: 10.0, baseClass: 'glass-input text-slate-700', activeClass: 'bg-emerald-100/90 border-emerald-500 text-emerald-800 ring-4 ring-emerald-500/30' },
        { id: 'cemerlang', nama: 'Cemerlang', min: 7.5, max: 8.9, baseClass: 'glass-input text-slate-700', activeClass: 'bg-blue-100/90 border-blue-500 text-blue-800 ring-4 ring-blue-500/30' },
        { id: 'kepujian', nama: 'Kepujian', min: 6.0, max: 7.4, baseClass: 'glass-input text-slate-700', activeClass: 'bg-indigo-100/90 border-indigo-500 text-indigo-800 ring-4 ring-indigo-500/30' },
        { id: 'lulus', nama: 'Lulus', min: 5.0, max: 5.9, baseClass: 'glass-input text-slate-700', activeClass: 'bg-amber-100/90 border-amber-500 text-amber-800 ring-4 ring-amber-500/30' },
        { id: 'lemah', nama: 'Lemah', min: 0.0, max: 4.99, baseClass: 'glass-input text-slate-700', activeClass: 'bg-rose-100/90 border-rose-500 text-rose-800 ring-4 ring-rose-500/30' }
      ],
      kemahiran: [
        { 
          id: 'sepakan', nama: 'Sepakan 10 m', 
          tahap: { 
            amat_cemerlang: 'Menunjukkan imbangan badan yang baik, sepakan kuat dan tepat mencapai sasaran. Kaki yang sesuai digunakan.', 
            cemerlang: 'Posisi badan stabil. Sepakan biasanya tepat tetapi kadang-kala kurang kekuatan.', 
            kepujian: 'Imbangan kadang kala tidak stabil, menyebabkan sepakan kurang tepat dan kurang kekuatan.', 
            lulus: 'Imbangan badan lemah. Sepakan tidak tepat dan jarang mencapai sasaran.', 
            lemah: 'Imbangan badan sangat lemah. Sepakan tiada kekuatan langsung dan salah teknik kaki.' 
          } 
        },
        { 
          id: 'hantaran', nama: 'Hantaran Pendek 10 m', 
          tahap: { 
            amat_cemerlang: 'Posisi sempurna, hantaran tepat, kawalan bola baik, dan komunikasi cemerlang.', 
            cemerlang: 'Posisi biasanya betul, hantaran majoriti tepat tetapi boleh diperbaiki untuk kawalan lebih baik.', 
            kepujian: 'Hantaran kurang tepat dan kadangkala melencung. Komunikasi lemah.', 
            lulus: 'Posisi sering salah, hantaran terlalu lemah/kuat dan tidak berkesan.', 
            lemah: 'Posisi sangat lemah, hantaran gagal sepenuhnya dan tiada komunikasi.' 
          } 
        },
        { 
          id: 'menjaring', nama: 'Menjaring 10 m', 
          tahap: { 
            amat_cemerlang: 'Imbangan badan baik, mengelecek cemerlang mengelirukan lawan, mampu bertukar arah pantas untuk 5 percubaan.', 
            cemerlang: 'Mengelecek terkawal, bertukar arah baik, mampu membuat 4 percubaan.', 
            kepujian: 'Imbangan kadang terganggu, gerakan kurang meyakinkan, mampu membuat 3 percubaan sederhana.', 
            lulus: 'Kawalan bola sangat lemah, sukar bertukar arah, hanya mampu 1-2 percubaan.', 
            lemah: 'Gagal mengawal imbangan, mudah kehilangan bola, tiada percubaan tepat.' 
          } 
        },
        { 
          id: 'jaga_gol', nama: 'Menjaga Gol 10 m', 
          tahap: { 
            amat_cemerlang: 'Posisi sentiasa sedia, membaca bola dengan baik, tangkapan kemas, cekap membuat terjunan, komunikasi cemerlang.', 
            cemerlang: 'Posisi bersedia, tangkapan baik walau terlepas sedikit, terjunan memuaskan.', 
            kepujian: 'Keputusan agak lambat, tangkapan kadang terlepas, terjunan kurang meyakinkan.', 
            lulus: 'Sering tersalah posisi, sukar membaca pergerakan, banyak bola terlepas.', 
            lemah: 'Gagal membaca permainan, tangkapan sangat lemah, tiada terjunan.' 
          } 
        },
        { 
          id: 'pegawai', nama: 'Kepegawaian (Undang-undang & Teknikal)', 
          tahap: { 
            amat_cemerlang: 'Mengenal pasti undang-undang dengan terperinci, mengambil keputusan tepat dan kefahaman sangat baik.', 
            cemerlang: 'Mengenal pasti undang-undang dengan tepat, keputusan cukup baik.', 
            kepujian: 'Penguasaan cukup. Masih perlu meningkatkan kemampuan teknikal dan keputusan.', 
            lulus: 'Penguasaan sederhana dan kurang meyakinkan. Memerlukan banyak latihan.', 
            lemah: 'Tidak memahami undang-undang. Penguasaan sangat lemah.' 
          } 
        }
      ]
    };

    /**
     * KAWALAN LOGIK STATE & API
     */
    const app = {
      state: { sesiSemasa: null, dataPelajarSemasa: null, dataPenilaianBorang: {} },

      /** Memanggil Endpoint App Script dengan error handling selamat */
      gasCall: async function(action, payload) {
        try {
          const res = await fetch(CONFIG_KURSUS.API_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
            body: JSON.stringify({ action: action, data: payload }) 
          });
          if (!res.ok) throw new Error("Gagal menyambung ke pangkalan data.");
          const result = await res.json();
          if (result && result.success === false) throw new Error(result.message);
          return result;
        } catch (e) { throw new Error(e.message); }
      },

      showLoader: (s) => document.getElementById('loader').classList.toggle('hidden-view', !s),
      
      showView: (v) => { 
        ['view-login', 'view-penilai', 'view-borang'].forEach(id => {
          document.getElementById(id).classList.add('hidden-view');
        }); 
        setTimeout(() => document.getElementById(v).classList.remove('hidden-view'), 50);
        window.scrollTo(0, 0);
      },

      setModLogin: function(mod) {
        document.getElementById('form-pelajar').classList.toggle('hidden-view', mod !== 'PELAJAR');
        document.getElementById('form-penilai').classList.toggle('hidden-view', mod !== 'PENILAI');
        const tabPelajar = document.getElementById('tab-pelajar');
        const tabPenilai = document.getElementById('tab-penilai');
        
        if(mod === 'PELAJAR') {
          tabPelajar.className = "flex-1 py-3.5 text-sm font-bold rounded-2xl bg-white text-brand shadow transition-all z-10";
          tabPenilai.className = "flex-1 py-3.5 text-sm font-bold rounded-2xl text-slate-600 hover:text-slate-900 transition-all z-10";
        } else {
          tabPenilai.className = "flex-1 py-3.5 text-sm font-bold rounded-2xl bg-white text-brand shadow transition-all z-10";
          tabPelajar.className = "flex-1 py-3.5 text-sm font-bold rounded-2xl text-slate-600 hover:text-slate-900 transition-all z-10";
        }
      },

      loginPelajar: async function() { alert("Antaramuka Profil Pelajar dalam penyelenggaraan Glassmorphism."); },

      loginKakitangan: async function() {
        const role = document.getElementById('login-role').value, pin = document.getElementById('login-pin').value.trim();
        if (!pin) return alert("Sila masukkan PIN Keselamatan.");
        this.showLoader(true);
        try {
          const res = await this.gasCall('loginKakitangan', { role, pin });
          if (res.success) {
            this.state.sesiSemasa = role; 
            document.getElementById('user-label').innerText = role; 
            document.getElementById('user-info').classList.remove('hidden-view');
            
            if (role === 'PENSYARAH') { alert('Panel Pensyarah sedang dimuatkan...'); this.logout(); } 
            else this.muatSenaraiPelajar();
          }
        } catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      muatSenaraiPelajar: async function() {
        this.showLoader(true);
        try {
          const senarai = await this.gasCall('getPelajarList');
          const container = document.getElementById('student-list-container'); container.innerHTML = '';
          senarai.forEach(p => {
            container.insertAdjacentHTML('beforeend', `
              <div class="glass-panel p-5 rounded-[2.5rem] flex items-center justify-between gap-4 hover:-translate-y-1 transition-all duration-300">
                <div class="flex items-center gap-4">
                  <div class="w-14 h-14 rounded-full bg-gradient-to-br from-slate-200 to-slate-100 flex items-center justify-center font-bold text-slate-400 border-2 border-white shadow-inner">
                    ${p.nama.charAt(0)}
                  </div>
                  <div>
                    <h3 class="font-bold text-slate-900 text-sm md:text-base leading-tight mb-1">${p.nama}</h3>
                    <p class="text-xs font-black text-brand/80 uppercase tracking-widest">${p.noKP}</p>
                  </div>
                </div>
                <button onclick="app.bukaBorangPenilaian('${p.idSistem}', '${p.noKP}', '${p.nama}')" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold py-3 px-6 rounded-2xl transition-transform active:scale-95 shadow-md shrink-0">Nilai</button>
              </div>`);
          });
          this.showView('view-penilai');
        } catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      bukaBorangPenilaian: async function(idSistem, noKP, nama) {
        this.state.dataPelajarSemasa = { idSistem, noKP, nama }; this.state.dataPenilaianBorang = {};
        document.getElementById('borang-subtitle').innerText = nama;
        this.binaUIBorang();
        
        this.showLoader(true);
        try {
          const rekod = await this.gasCall('getPenilaianPelajar', { idSistem, penilai: this.state.sesiSemasa });
          Object.keys(rekod).forEach(kId => { 
            if (rekod[kId].adaData) { 
              this.pilihTahapRubrik(kId, rekod[kId].tahapId); 
              document.getElementById(`markah-${kId}`).value = rekod[kId].markah; 
              this.janaUlasanAutomatik(kId, rekod[kId].tahapId, rekod[kId].markah);
            } 
          });
          this.kiraJumlahMarkah(); this.showView('view-borang');
        } catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      binaUIBorang: function() {
        const c = document.getElementById('rubrik-container'); c.innerHTML = '';
        CONFIG_KURSUS.kemahiran.forEach((k, idx) => {
          let tHTML = '';
          CONFIG_KURSUS.tahapList.forEach(t => { 
            tHTML += `<div id="card-${k.id}-${t.id}" onclick="app.pilihTahapRubrik('${k.id}', '${t.id}')" 
                        class="border-2 border-transparent rounded-2xl p-4 text-center cursor-pointer transition-all hover:-translate-y-1 ${t.baseClass} active:scale-95 flex flex-col justify-center min-h-[90px]">
                        <h4 class="text-sm font-bold leading-tight">${t.nama}</h4>
                        <p class="text-xs font-semibold mt-1.5 opacity-60">${t.min} - ${t.max}</p>
                      </div>`; 
          });
          
          c.insertAdjacentHTML('beforeend', `
            <div class="glass-panel rounded-[2.5rem] p-6 relative overflow-hidden">
              <div class="flex items-center gap-3 mb-6">
                <span class="bg-slate-900 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-black shadow-md">${idx + 1}</span>
                <h3 class="font-extrabold text-slate-900 text-lg tracking-tight">${k.nama}</h3>
              </div>
              
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 mb-6">${tHTML}</div>
              
              <div id="input-group-${k.id}" class="hidden-view glass-input p-5 rounded-2xl mb-4 transition-all">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-3">Penetapan Markah (Max: 10)</label>
                <div class="flex items-center gap-4">
                  <input type="number" id="markah-${k.id}" step="0.1" onchange="app.kemaskiniInputMarkah('${k.id}')" 
                    class="w-32 text-2xl font-black text-brand bg-white border-0 ring-2 ring-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-brand/30 transition-all text-center shadow-sm">
                  <span id="hint-${k.id}" class="text-xs font-bold text-slate-400 uppercase tracking-wider bg-white/50 px-3 py-1.5 rounded-lg"></span>
                </div>
              </div>
              
              <div id="laporan-group-${k.id}" class="hidden-view transition-all">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-3">Justifikasi Pencapaian</label>
                <textarea id="laporan-${k.id}" class="w-full text-sm font-medium text-slate-700 bg-white/70 border-0 ring-1 ring-slate-200 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-brand/50 transition-all leading-relaxed shadow-sm" rows="3"></textarea>
              </div>
            </div>`);
        });
      },

      pilihTahapRubrik: function(kId, tId) {
        this.state.dataPenilaianBorang[kId] = tId;
        
        // Tetapan Gaya Glassmorphism Aktif
        CONFIG_KURSUS.tahapList.forEach(t => {
           const el = document.getElementById(`card-${kId}-${t.id}`);
           el.className = `border-2 border-transparent rounded-2xl p-4 text-center cursor-pointer transition-all hover:-translate-y-1 ${t.baseClass} active:scale-95 flex flex-col justify-center min-h-[90px]`;
        });
        
        const tahapDef = CONFIG_KURSUS.tahapList.find(t => t.id === tId);
        const selEl = document.getElementById(`card-${kId}-${tId}`);
        selEl.className = `border-2 rounded-2xl p-4 text-center cursor-pointer transition-all active:scale-95 flex flex-col justify-center min-h-[90px] shadow-lg ${tahapDef.activeClass} -translate-y-1`;
        
        const inputEl = document.getElementById(`markah-${kId}`);
        inputEl.min = tahapDef.min; inputEl.max = tahapDef.max;
        let cur = Number(inputEl.value); 
        if (!inputEl.value || cur < tahapDef.min || cur > tahapDef.max) inputEl.value = tahapDef.max;
        
        document.getElementById(`hint-${kId}`).innerText = `(Had: ${tahapDef.min} - ${tahapDef.max})`;
        document.getElementById(`input-group-${kId}`).classList.remove('hidden-view'); 
        document.getElementById(`laporan-group-${kId}`).classList.remove('hidden-view');
        
        this.kiraJumlahMarkah(); this.janaUlasanAutomatik(kId, tId, inputEl.value);
      },

      kemaskiniInputMarkah: function(kId) {
        const tId = this.state.dataPenilaianBorang[kId], inputEl = document.getElementById(`markah-${kId}`), tDef = CONFIG_KURSUS.tahapList.find(t => t.id === tId);
        let val = Number(inputEl.value);
        if (val < tDef.min) inputEl.value = tDef.min; if (val > tDef.max) inputEl.value = tDef.max;
        this.kiraJumlahMarkah(); this.janaUlasanAutomatik(kId, tId, inputEl.value);
      },

      // Fungsi Laporan Berdasarkan Rubrik Futsal
      janaUlasanAutomatik: function(kId, tId, m) {
        const u = CONFIG_KURSUS.kemahiran.find(k => k.id === kId).tahap[tId];
        document.getElementById(`laporan-${kId}`).value = `Laporan Pemerhatian: ${u}`;
      },

      kiraJumlahMarkah: function() {
        let t = 0; CONFIG_KURSUS.kemahiran.forEach(k => { t += Number(document.getElementById(`markah-${k.id}`)?.value) || 0; });
        document.getElementById('borang-total').innerText = t.toFixed(1);
      },

      simpanPenilaian: async function() {
        const payload = { idSistem: this.state.dataPelajarSemasa.idSistem, penilai: this.state.sesiSemasa, kemahiran: {} };
        for (const k of CONFIG_KURSUS.kemahiran) {
          const tId = this.state.dataPenilaianBorang[k.id], m = document.getElementById(`markah-${k.id}`).value, l = document.getElementById(`laporan-${k.id}`).value;
          if (!tId || !m) return alert(`Lengkapkan pemarkahan untuk: ${k.nama}`);
          payload.kemahiran[k.id] = { tahapId: tId, markah: Number(m), laporan: l };
        }
        this.showLoader(true);
        try { await this.gasCall('savePenilaian', payload); alert('Pemarkahan Berjaya Disimpan!'); this.showView('view-penilai'); } 
        catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      logout: function() {
        this.state.sesiSemasa = null; this.state.dataPelajarSemasa = null;
        ['nokp-input', 'login-pin'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('user-info').classList.add('hidden-view'); this.showView('view-login');
      }
    };
  </script>
</body>
</html>
