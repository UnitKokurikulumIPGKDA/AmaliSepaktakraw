<!DOCTYPE html>
<html lang="ms" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Pemarkahan Sepak Takraw MPU3421</title>
  
  <!-- Font Moden: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: { brand: '#2563eb', accent: '#06b6d4' },
          animation: { 'gradient-x': 'gradient-x 15s ease infinite' },
          keyframes: {
            'gradient-x': {
              '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
              '50%': { 'background-size': '200% 200%', 'background-position': 'right center' }
            }
          }
        } 
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .view-transition { transition: opacity 0.5s ease, transform 0.5s ease; }
    .hidden-view { display: none !important; opacity: 0; transform: translateY(20px); }
    .floating-bar { padding-bottom: env(safe-area-inset-bottom); }
    
    /* GLASSMORPHISM UTILITIES */
    .glass-panel {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    
    /* Animasi Modal */
    .modal-enter { animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes modalSlideUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    
    /* Custom Checkbox Style */
    .checklist-cb {
        appearance: none; width: 1.25rem; height: 1.25rem;
        border: 2px solid #cbd5e1; border-radius: 0.375rem;
        outline: none; cursor: pointer; transition: all 0.2s ease;
        position: relative; flex-shrink: 0;
    }
    .checklist-cb:checked { background-color: #ef4444; border-color: #ef4444; }
    .checklist-cb:checked::after {
        content: '✕'; position: absolute; color: white; font-size: 0.85rem; font-weight: bold;
        left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-600 via-indigo-600 to-cyan-500 animate-gradient-x text-slate-800 antialiased min-h-screen relative pb-32 selection:bg-accent selection:text-white">

  <!-- AppBar -->
  <header class="glass-panel sticky top-0 z-40 px-5 py-4 flex justify-between items-center transition-all rounded-b-3xl">
    <div class="flex items-center gap-3">
      <div class="bg-gradient-to-tr from-brand to-accent text-white w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm shadow-lg">ST</div>
      <h1 class="font-extrabold text-slate-900 tracking-tight text-xl">SEPAK TAKRAW</h1>
    </div>
    <div id="user-info" class="hidden-view flex items-center gap-2">
      <span id="user-label" class="text-xs font-bold text-brand bg-white/80 px-3 py-1.5 rounded-full shadow-sm"></span>
      <button onclick="app.logout()" class="text-sm font-bold text-rose-600 hover:text-white hover:bg-rose-500 bg-white/80 px-3 py-1.5 rounded-full transition-all shadow-sm">Keluar</button>
    </div>
  </header>

  <!-- Loader -->
  <div id="loader" class="hidden-view fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex flex-col justify-center items-center transition-all duration-300">
    <div class="w-14 h-14 border-4 border-white/30 border-t-accent rounded-full animate-spin mb-4 shadow-xl"></div>
    <p class="font-bold text-white tracking-widest text-sm uppercase">Menyegerak Data...</p>
  </div>

  <!-- MODAL: LAPORAN PENSYARAH -->
  <div id="modal-laporan" class="hidden-view fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex justify-center items-end sm:items-center p-4 transition-all duration-300">
    <div class="bg-white/95 backdrop-blur-xl w-full max-w-xl max-h-[85vh] overflow-hidden rounded-[2.5rem] shadow-2xl flex flex-col modal-enter border border-white/50">
      <div class="p-6 border-b border-slate-200/50 flex justify-between items-center bg-white/50 rounded-t-[2.5rem]">
        <h3 class="font-black text-slate-900 text-xl tracking-tight">Analitik Laporan</h3>
        <button onclick="app.tutupModalLaporan()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-full p-2.5 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div id="modal-body" class="p-6 overflow-y-auto space-y-8"></div>
    </div>
  </div>

  <main class="max-w-xl mx-auto px-4 mt-8">
    
    <!-- PANDANGAN 1: LOG MASUK -->
    <div id="view-login" class="view-transition">
      <div class="text-center mb-10 mt-6 text-white">
        <h2 class="text-4xl font-black mb-2 drop-shadow-md">Amali MPU3421</h2>
        <p class="text-white/80 text-sm font-medium">Log masuk portal pemarkahan Sepak Takraw.</p>
      </div>
      
      <div class="glass-panel p-2 rounded-3xl mb-8 flex relative shadow-xl">
        <button id="tab-pelajar" onclick="app.setModLogin('PELAJAR')" class="flex-1 py-3.5 text-sm font-bold rounded-2xl bg-white text-brand shadow transition-all z-10">Pelajar</button>
        <button id="tab-penilai" onclick="app.setModLogin('PENILAI')" class="flex-1 py-3.5 text-sm font-bold rounded-2xl text-slate-600 hover:text-slate-900 transition-all z-10">Kakitangan</button>
      </div>

      <div class="glass-panel p-8 rounded-[2.5rem]">
        <div id="form-pelajar" class="space-y-6">
          <div>
            <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Kad Pengenalan</label>
            <input type="number" id="nokp-input" class="w-full glass-input rounded-2xl px-5 py-4 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-brand focus:bg-white transition-all placeholder:font-medium placeholder:text-slate-400" placeholder="Tanpa Sengkang (Cth: 010101)">
          </div>
          <button onclick="app.loginPelajar()" class="w-full bg-gradient-to-r from-brand to-accent hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 text-lg">Akses Pelajar</button>
        </div>

        <div id="form-penilai" class="hidden-view space-y-6">
          <div>
            <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Peranan</label>
            <select id="login-role" class="w-full glass-input rounded-2xl px-5 py-4 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-brand focus:bg-white appearance-none transition-all">
              <option value="P1">Penilai 1</option>
              <option value="P2">Penilai 2</option>
              <option value="PENSYARAH">Pensyarah / Penyelaras</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">PIN Keselamatan</label>
            <input type="password" id="login-pin" class="w-full glass-input rounded-2xl px-5 py-4 text-slate-900 font-bold focus:outline-none focus:ring-2 focus:ring-brand focus:bg-white transition-all placeholder:font-medium placeholder:text-slate-400" placeholder="****">
          </div>
          <button onclick="app.loginKakitangan()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-xl transition-transform active:scale-95 text-lg">Masuk Portal</button>
        </div>
      </div>
    </div>

    <!-- PANDANGAN 2: PROFIL PELAJAR -->
    <div id="view-profil" class="hidden-view view-transition space-y-6">
      <div class="glass-panel p-8 rounded-[2.5rem]">
        <h2 class="text-2xl font-black text-slate-900 mb-6">Profil Ujian</h2>
        <div class="grid grid-cols-2 gap-4 text-sm mb-8">
          <div class="glass-input p-5 rounded-2xl">
            <p class="text-slate-500 text-xs uppercase tracking-wider font-black mb-1">Nama</p>
            <p class="font-bold text-slate-900 leading-tight" id="lbl-nama"></p>
          </div>
          <div class="glass-input p-5 rounded-2xl">
            <p class="text-slate-500 text-xs uppercase tracking-wider font-black mb-1">Status</p>
            <p class="font-black text-accent" id="lbl-status"></p>
          </div>
        </div>
        <div class="border-2 border-dashed border-slate-300/50 rounded-3xl p-6 text-center flex flex-col items-center bg-white/40">
          <img id="img-preview" src="" class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg mb-5">
          <label class="cursor-pointer bg-white hover:bg-slate-50 text-slate-800 font-bold py-3.5 px-6 rounded-2xl transition-all inline-block mb-2 shadow-sm border border-slate-200 w-full">
            Muat Naik Gambar Aksi
            <input type="file" id="file-input" accept="image/png, image/jpeg" class="hidden">
          </label>
          <p class="text-xs font-semibold text-slate-500 mb-5 uppercase tracking-widest">Sokongan: JPG/PNG (Max 2MB)</p>
          <button id="btn-upload" onclick="app.uploadImage()" class="bg-gradient-to-r from-brand to-accent text-white font-bold py-4 px-6 rounded-2xl shadow-lg w-full transition-all active:scale-95">Simpan Data</button>
          <p id="upload-status" class="text-sm mt-4 font-bold tracking-wide"></p>
        </div>
      </div>
    </div>

    <!-- PANDANGAN 3: SENARAI PELAJAR -->
    <div id="view-penilai" class="hidden-view view-transition">
      <h2 class="text-3xl font-black text-white mb-6 drop-shadow-md">Calon Amali</h2>
      <div id="student-list-container" class="space-y-5"></div>
    </div>

    <!-- PANDANGAN 4: BORANG RUBRIK -->
    <div id="view-borang" class="hidden-view view-transition">
      <button onclick="app.showView('view-penilai')" class="mb-6 text-sm font-bold text-white/90 hover:text-white flex items-center gap-1.5 glass-panel py-2 px-5 rounded-full w-fit transition-all active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg> Kembali
      </button>
      
      <div class="glass-panel p-6 rounded-[2.5rem] mb-8 flex items-center justify-between gap-2">
        <div class="flex items-center gap-5">
          <div class="w-14 h-14 bg-gradient-to-br from-brand to-accent rounded-full flex items-center justify-center text-white shadow-inner shrink-0">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </div>
          <div>
            <p class="text-xs font-black text-brand uppercase tracking-widest mb-1">Penilaian Aktif</p>
            <h2 id="borang-subtitle" class="font-extrabold text-slate-900 text-xl leading-tight line-clamp-1"></h2>
          </div>
        </div>
      </div>

      <div id="rubrik-container" class="space-y-8 pb-10"></div>

      <div class="fixed bottom-0 left-0 right-0 z-30 pointer-events-none floating-bar">
        <div class="max-w-xl mx-auto pointer-events-auto px-4 pb-6 pt-10 bg-gradient-to-t from-slate-900/80 via-slate-900/50 to-transparent">
          <div class="glass-panel p-3 rounded-[2.5rem] shadow-2xl flex justify-between items-center border border-white/20 bg-slate-900/80 backdrop-blur-xl">
            <div class="pl-6 py-2">
              <p class="text-white/60 text-[11px] font-black uppercase tracking-widest mb-0.5">Jumlah Markah</p>
              <div class="font-black text-white text-3xl leading-none flex items-baseline gap-1">
                <span id="borang-total">0.0</span><span class="text-base font-semibold text-white/50">/60</span>
              </div>
            </div>
            <button onclick="app.simpanPenilaian()" class="bg-gradient-to-r from-emerald-400 to-teal-500 hover:opacity-90 text-white font-extrabold py-4 px-10 rounded-full shadow-lg shadow-emerald-500/30 transition-transform active:scale-95 text-lg">Hantar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PANDANGAN 5: PAPAN PEMUKA PENSYARAH -->
    <div id="view-pensyarah" class="hidden-view view-transition">
      <h2 class="text-3xl font-black text-white mb-6 drop-shadow-md">Analisis Keseluruhan</h2>
      <div id="laporan-list-container" class="space-y-6"></div>
    </div>

  </main>

  <script>
    /**
     * =====================================================================
     * KONFIGURASI PANGKALAN DATA & RUBRIK
     * =====================================================================
     */
    const CONFIG_KURSUS = {
      API_URL: 'https://script.google.com/macros/s/AKfycbxIQMBSVJ5xAKBuNlArTkLw5C5-yCaRCHv_g3tug4F4lcphiX8eRMsF0rEILivZzX2A4A/exec',
      tahapList: [
        { id: 'cemerlang', nama: 'Cemerlang', min: 16.0, max: 20.0, baseClass: 'glass-input text-slate-700 hover:bg-emerald-50', activeClass: 'bg-emerald-100/90 border-emerald-500 text-emerald-800 ring-4 ring-emerald-500/30' },
        { id: 'sederhana', nama: 'Sederhana', min: 10.0, max: 15.9, baseClass: 'glass-input text-slate-700 hover:bg-amber-50', activeClass: 'bg-amber-100/90 border-amber-500 text-amber-800 ring-4 ring-amber-500/30' },
        { id: 'lemah', nama: 'Lemah', min: 0.0, max: 9.99, baseClass: 'glass-input text-slate-700 hover:bg-rose-50', activeClass: 'bg-rose-100/90 border-rose-500 text-rose-800 ring-4 ring-rose-500/30' }
      ],
      kemahiran: [
        { 
          id: 'servis', 
          nama: 'Servis (10 Markah)', 
          senaraiSemak: [
            "Kedudukan kaki sokongan stabil di dalam bulatan",
            "Postur bersedia dan fokus mata tepat pada bola",
            "Teknik sepak sila tepat; pemindahan berat badan lancar",
            "Sentuhan bola tepat pada bahagian dalam / kekura kaki",
            "Kawalan ketinggian, kelajuan, dan sasaran sempurna",
            "Pergerakan ikut lajak lancar & kembali ke posisi seimbang"
          ]
        },
        { 
          id: 'mengumpan', 
          nama: 'Mengumpan (10 Markah)', 
          senaraiSemak: [
            "Memandang arah pergerakan bola dengan tepat",
            "Bukaan langkah dan kawalan imbangan badan amat kukuh",
            "Sentuhan lancar dan terkawal",
            "Kordinasi pemindahan daya tepat (bola tidak berputar ideal)",
            "Pergerakan ikut lajak kemas serta merta bersedia"
          ]
        },
        { 
          id: 'menanduk', 
          nama: 'Menanduk (10 Markah)', 
          senaraiSemak: [
            "Memastikan kelajuan dan ketinggian bola sangat tepat",
            "Postur badan fleksibel dan bersedia untuk rejaman",
            "Kontak bola tepat pada bahagian dahi",
            "Ayunan leher/dada pantas; kawalan arah dan kelajuan amat baik",
            "Mendarat/bergerak secara seimbang dan selamat",
            "Serta-merta sedia untuk tindakan seterusnya"
          ]
        }
      ]
    };

    /**
     * =====================================================================
     * KAWALAN LOGIK STATE & API (Frontend)
     * =====================================================================
     */
    const app = {
      state: { sesiSemasa: null, dataPelajarSemasa: null, dataPenilaianBorang: {}, senaraiLaporanPensyarah: [] },

      /** 
       * Fungsi komunikasi utama menggunakan Fetch API dengan pengendalian ralat (try/catch). 
       */
      gasCall: async function(action, payload) {
        try {
          const res = await fetch(CONFIG_KURSUS.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, data: payload }) });
          if (!res.ok) throw new Error("Gagal menyambung ke pelayan.");
          const result = await res.json();
          if (result && result.success === false) throw new Error(result.message);
          return result;
        } catch (e) { throw new Error(e.message); }
      },

      showLoader: (s) => document.getElementById('loader').classList.toggle('hidden-view', !s),
      
      showView: (v) => { 
        ['view-login', 'view-profil', 'view-penilai', 'view-borang', 'view-pensyarah'].forEach(id => document.getElementById(id).classList.add('hidden-view')); 
        setTimeout(() => document.getElementById(v).classList.remove('hidden-view'), 50); window.scrollTo(0, 0);
      },

      setModLogin: function(mod) {
        document.getElementById('form-pelajar').classList.toggle('hidden-view', mod !== 'PELAJAR');
        document.getElementById('form-penilai').classList.toggle('hidden-view', mod !== 'PENILAI');
        const tabP = document.getElementById('tab-pelajar'), tabK = document.getElementById('tab-penilai');
        if(mod === 'PELAJAR') {
          tabP.className = "flex-1 py-3.5 text-sm font-bold rounded-2xl bg-white text-brand shadow transition-all z-10";
          tabK.className = "flex-1 py-3.5 text-sm font-bold rounded-2xl text-slate-600 hover:text-slate-900 transition-all z-10";
        } else {
          tabK.className = "flex-1 py-3.5 text-sm font-bold rounded-2xl bg-white text-brand shadow transition-all z-10";
          tabP.className = "flex-1 py-3.5 text-sm font-bold rounded-2xl text-slate-600 hover:text-slate-900 transition-all z-10";
        }
      },

      loginPelajar: async function() {
        const noKP = document.getElementById('nokp-input').value.trim();
        if (!noKP) return alert("Sila masukkan No. KP");
        this.showLoader(true);
        try {
          const res = await this.gasCall('loginPelajar', { noKP });
          if (res.success) {
            this.state.sesiSemasa = 'PELAJAR'; this.state.dataPelajarSemasa = res.pelajar;
            document.getElementById('user-label').innerText = 'Pelajar'; document.getElementById('user-info').classList.remove('hidden-view');
            document.getElementById('lbl-nama').innerText = res.pelajar.nama; 
            document.getElementById('lbl-status').innerText = res.pelajar.status || 'Belum Muat Naik';
            document.getElementById('img-preview').src = res.pelajar.linkGambar || 'https://via.placeholder.com/150?text=Gambar';
            this.showView('view-profil');
          }
        } catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      uploadImage: function() {
        const fileInput = document.getElementById('file-input');
        if (fileInput.files.length === 0) return alert("Pilih fail dahulu.");
        if (fileInput.files[0].size > 2097152) return alert("Fail mesti bawah 2MB.");
        
        const status = document.getElementById('upload-status'), btn = document.getElementById('btn-upload');
        status.className = "text-sm mt-4 font-bold text-amber-500 tracking-wide"; status.innerText = "Memproses..."; btn.disabled = true;

        const reader = new FileReader();
        reader.onload = async (e) => {
          status.innerText = "Menghantar ke awan...";
          try {
            const res = await this.gasCall('muatNaikGambar', { base64Data: e.target.result, filename: fileInput.files[0].name, noKP: this.state.dataPelajarSemasa.noKP });
            if (res.success) {
              status.className = "text-sm mt-4 font-bold text-emerald-500 tracking-wide"; status.innerText = "Berjaya Disimpan!";
              document.getElementById('img-preview').src = res.url; document.getElementById('lbl-status').innerText = 'Selesai';
            }
          } catch (err) { status.className = "text-sm mt-4 font-bold text-rose-500 tracking-wide"; status.innerText = err.message; } finally { btn.disabled = false; }
        };
        reader.readAsDataURL(fileInput.files[0]);
      },

      loginKakitangan: async function() {
        const role = document.getElementById('login-role').value, pin = document.getElementById('login-pin').value.trim();
        if (!pin) return alert("Sila masukkan PIN Keselamatan.");
        this.showLoader(true);
        try {
          const res = await this.gasCall('loginKakitangan', { role, pin });
          if (res.success) {
            this.state.sesiSemasa = role; 
            document.getElementById('user-label').innerText = role; 
            document.getElementById('user-info').classList.remove('hidden-view');
            if (role === 'PENSYARAH') this.muatLaporanPensyarah(); else this.muatSenaraiPelajar();
          }
        } catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      muatSenaraiPelajar: async function() {
        this.showLoader(true);
        try {
          const senarai = await this.gasCall('getPelajarList');
          const container = document.getElementById('student-list-container'); container.innerHTML = '';
          senarai.forEach(p => {
            container.insertAdjacentHTML('beforeend', `
              <div class="glass-panel p-5 rounded-[2.5rem] flex items-center justify-between gap-4 hover:-translate-y-1 transition-all duration-300 cursor-pointer" onclick="app.bukaBorangPenilaian('${p.idSistem}', '${p.noKP}', '${p.nama}')">
                <div class="flex items-center gap-4">
                  <img src="${p.linkGambar || 'https://via.placeholder.com/60?text=P'}" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-sm bg-white/50">
                  <div>
                    <h3 class="font-bold text-slate-900 text-sm md:text-base leading-tight mb-1">${p.nama}</h3>
                    <p class="text-xs font-black text-brand uppercase tracking-widest opacity-80">${p.idSistem}</p>
                  </div>
                </div>
                <div class="bg-slate-900 text-white text-sm font-bold py-3 px-6 rounded-2xl shadow-md shrink-0">Nilai</div>
              </div>`);
          });
          this.showView('view-penilai');
        } catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      bukaBorangPenilaian: async function(idSistem, noKP, nama) {
        this.state.dataPelajarSemasa = { idSistem, noKP, nama }; this.state.dataPenilaianBorang = {};
        document.getElementById('borang-subtitle').innerText = nama; this.binaUIBorang();
        
        this.showLoader(true);
        try {
          const rekod = await this.gasCall('getPenilaianPelajar', { idSistem, penilai: this.state.sesiSemasa });
          
          Object.keys(rekod).forEach(kId => { 
            if (rekod[kId].adaData && rekod[kId].tahapId !== '') { 
              this.pilihTahapRubrik(kId, rekod[kId].tahapId); 
              document.getElementById(`markah-${kId}`).value = rekod[kId].markah; 
              
              if (rekod[kId].semakan) {
                const checkedIndexes = rekod[kId].semakan.split(',');
                checkedIndexes.forEach(idx => {
                  const cb = document.getElementById(`cb-${kId}-${idx}`);
                  if(cb) cb.checked = true;
                });
              }
              
              if (rekod[kId].laporan) document.getElementById(`laporan-${kId}`).value = rekod[kId].laporan;
              else this.janaUlasanAutomatik(kId);
            } 
          });
          this.kiraJumlahMarkah(); this.showView('view-borang');
        } catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      /** Membina HTML borang dan senarai semak berdasarkan CONFIG_KURSUS */
      binaUIBorang: function() {
        const c = document.getElementById('rubrik-container'); c.innerHTML = '';
        CONFIG_KURSUS.kemahiran.forEach((k, idx) => {
          let tHTML = '';
          CONFIG_KURSUS.tahapList.forEach(t => { 
            tHTML += `<div id="card-${k.id}-${t.id}" onclick="app.pilihTahapRubrik('${k.id}', '${t.id}')" 
                        class="border-2 border-transparent rounded-2xl p-4 text-center cursor-pointer transition-all hover:-translate-y-1 ${t.baseClass} active:scale-95 flex flex-col justify-center min-h-[90px]">
                        <h4 class="text-sm font-extrabold leading-tight">${t.nama}</h4>
                        <p class="text-[10px] font-black tracking-wider uppercase mt-1.5 opacity-60">${t.min} - ${t.max}</p>
                      </div>`; 
          });
          
          let cHTML = '';
          k.senaraiSemak.forEach((item, cIdx) => {
            cHTML += `
              <label class="flex items-start gap-3 p-3 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 cursor-pointer transition-colors shadow-sm">
                <input type="checkbox" id="cb-${k.id}-${cIdx}" value="${cIdx}" onchange="app.kemaskiniSemakan('${k.id}')" class="checklist-cb mt-0.5">
                <span class="text-sm font-medium text-slate-700 leading-tight">${item}</span>
              </label>
            `;
          });
          
          c.insertAdjacentHTML('beforeend', `
            <div class="glass-panel rounded-[2.5rem] p-6 relative overflow-hidden">
              <div class="flex items-center gap-3 mb-6">
                <span class="bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-black shadow-md">${idx + 1}</span>
                <h3 class="font-extrabold text-slate-900 text-lg tracking-tight">${k.nama}</h3>
              </div>
              
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8">${tHTML}</div>
              
              <div id="checklist-group-${k.id}" class="hidden-view bg-rose-50/50 p-5 rounded-3xl border border-rose-100 mb-6 transition-all">
                <p class="block text-xs font-black text-rose-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                  Tandakan pada perlakuan yang TIDAK dilaksanakan:
                </p>
                <div class="space-y-2">${cHTML}</div>
              </div>

              <div id="input-group-${k.id}" class="hidden-view glass-input p-5 rounded-2xl mb-4 transition-all">
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Penetapan Skor (Max: 20)</label>
                <div class="flex items-center gap-4">
                  <input type="number" id="markah-${k.id}" step="0.1" onchange="app.kemaskiniInputMarkah('${k.id}')" 
                    class="w-32 text-2xl font-black text-brand bg-white border-0 ring-2 ring-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-4 focus:ring-brand/30 transition-all text-center shadow-sm">
                  <span id="hint-${k.id}" class="text-xs font-bold text-slate-400 uppercase tracking-wider bg-white/50 px-3 py-1.5 rounded-lg"></span>
                </div>
              </div>
              
              <div id="laporan-group-${k.id}" class="hidden-view transition-all">
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Analisis Pintar Berdasarkan Senarai Semak</label>
                <textarea id="laporan-${k.id}" class="w-full text-sm font-medium text-slate-700 bg-white/70 border-0 ring-1 ring-slate-200 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-brand/50 transition-all leading-relaxed shadow-sm" rows="5"></textarea>
              </div>
            </div>`);
        });
      },

      pilihTahapRubrik: function(kId, tId) {
        this.state.dataPenilaianBorang[kId] = tId;
        CONFIG_KURSUS.tahapList.forEach(t => { 
          const el = document.getElementById(`card-${kId}-${t.id}`);
          if (el) el.className = `border-2 border-transparent rounded-2xl p-4 text-center cursor-pointer transition-all hover:-translate-y-1 ${t.baseClass} active:scale-95 flex flex-col justify-center min-h-[90px]`; 
        });
        
        const tahapDef = CONFIG_KURSUS.tahapList.find(t => t.id === tId);
        // Null check sekiranya pangkalan data simpan ID tahap lama yang telah dibuang
        if (!tahapDef) return; 

        const selEl = document.getElementById(`card-${kId}-${tId}`);
        if (selEl) selEl.className = `border-2 rounded-2xl p-4 text-center cursor-pointer transition-all active:scale-95 flex flex-col justify-center min-h-[90px] shadow-lg ${tahapDef.activeClass} -translate-y-1`;
        
        const inputEl = document.getElementById(`markah-${kId}`); inputEl.min = tahapDef.min; inputEl.max = tahapDef.max;
        let cur = Number(inputEl.value); if (!inputEl.value || cur < tahapDef.min || cur > tahapDef.max) inputEl.value = tahapDef.max;
        
        document.getElementById(`hint-${kId}`).innerText = `(Had: ${tahapDef.min} - ${tahapDef.max})`;
        document.getElementById(`input-group-${kId}`).classList.remove('hidden-view'); 
        document.getElementById(`checklist-group-${kId}`).classList.remove('hidden-view');
        document.getElementById(`laporan-group-${kId}`).classList.remove('hidden-view');
        
        this.kiraJumlahMarkah(); this.janaUlasanAutomatik(kId);
      },

      kemaskiniInputMarkah: function(kId) {
        const tId = this.state.dataPenilaianBorang[kId];
        const inputEl = document.getElementById(`markah-${kId}`);
        const tDef = CONFIG_KURSUS.tahapList.find(t => t.id === tId);
        
        if (!tDef) return;

        let val = Number(inputEl.value); 
        if (val < tDef.min) inputEl.value = tDef.min; 
        if (val > tDef.max) inputEl.value = tDef.max;
        
        this.kiraJumlahMarkah();
      },

      kemaskiniSemakan: function(kId) {
        this.janaUlasanAutomatik(kId);
      },

      /** Menjana Ulasan Pintar Berdasarkan Senarai Semak Yang DITANDA */
      janaUlasanAutomatik: function(kId) {
        const kDef = CONFIG_KURSUS.kemahiran.find(k => k.id === kId);
        if(!kDef) return;

        const checklistItems = kDef.senaraiSemak;
        let checkedText = [];
        
        checklistItems.forEach((item, idx) => {
          const cb = document.getElementById(`cb-${kId}-${idx}`);
          if (cb && cb.checked) checkedText.push(item);
        });

        let ulasan = `Analisis Perlakuan:\n`;
        
        if (checkedText.length === 0) {
          ulasan += `Secara keseluruhannya, pelajar berjaya mempamerkan kriteria perlakuan kemahiran dengan sangat cemerlang.`;
        } else {
          ulasan += `Berdasarkan pemerhatian, pelajar gagal melaksanakan perlakuan berikut:\n`;
          checkedText.forEach((item, index) => {
             ulasan += `${index + 1}. ${item}\n`;
          });
        }
        
        document.getElementById(`laporan-${kId}`).value = ulasan;
      },

      kiraJumlahMarkah: function() {
        let t = 0; CONFIG_KURSUS.kemahiran.forEach(k => { t += Number(document.getElementById(`markah-${k.id}`)?.value) || 0; });
        document.getElementById('borang-total').innerText = t.toFixed(1);
      },

      simpanPenilaian: async function() {
        const payload = { idSistem: this.state.dataPelajarSemasa.idSistem, penilai: this.state.sesiSemasa, kemahiran: {} };
        let adaIsi = false;
        
        for (const k of CONFIG_KURSUS.kemahiran) {
          const tId = this.state.dataPenilaianBorang[k.id] || '';
          const m = document.getElementById(`markah-${k.id}`) ? document.getElementById(`markah-${k.id}`).value : '';
          const l = document.getElementById(`laporan-${k.id}`) ? document.getElementById(`laporan-${k.id}`).value : '';
          
          let semakanDitanda = [];
          if (k.senaraiSemak) {
            k.senaraiSemak.forEach((item, idx) => {
              const cb = document.getElementById(`cb-${k.id}-${idx}`);
              if (cb && cb.checked) semakanDitanda.push(idx);
            });
          }
          const semakanString = semakanDitanda.join(',');
          
          if (tId && m) {
            payload.kemahiran[k.id] = { tahapId: tId, markah: Number(m), semakan: semakanString, laporan: l }; 
            adaIsi = true;
          } else { 
            payload.kemahiran[k.id] = { tahapId: '', markah: '', semakan: '', laporan: '' }; 
          }
        }
        
        if (!adaIsi) return alert('Sila isi sekurang-kurangnya satu kemahiran.');
        
        this.showLoader(true);
        try { await this.gasCall('savePenilaian', payload); alert('Pemarkahan Disimpan!'); this.showView('view-penilai'); } 
        catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      muatLaporanPensyarah: async function() {
        this.showLoader(true);
        try {
          const laporan = await this.gasCall('getLaporan', {});
          this.state.senaraiLaporanPensyarah = laporan;
          const container = document.getElementById('laporan-list-container'); container.innerHTML = '';
          
          laporan.forEach((p, idx) => {
            let badgeStyle = "bg-rose-100 text-rose-700 border border-rose-200";
            if (p.status === 'Lengkap') badgeStyle = "bg-emerald-100 text-emerald-700 border border-emerald-200";
            else if (p.status === 'Separuh') badgeStyle = "bg-amber-100 text-amber-700 border border-amber-200";

            container.insertAdjacentHTML('beforeend', `
              <div class="glass-panel p-6 rounded-[2.5rem] flex flex-col gap-5 hover:-translate-y-1 transition-all duration-300">
                <div class="flex items-center justify-between border-b border-slate-200/50 pb-5">
                  <div>
                    <h3 class="font-black text-slate-900 text-lg leading-tight">${p.nama}</h3>
                    <p class="text-xs font-bold text-slate-500 mt-1 uppercase tracking-widest">${p.idSistem}</p>
                  </div>
                  <span class="text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-xl shadow-sm ${badgeStyle}">${p.status}</span>
                </div>
                <div class="flex justify-between items-center bg-white/40 p-4 rounded-2xl">
                  <div class="text-center"><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Skor P1</p><p class="font-black text-slate-700 text-xl">${p.totalP1 !== null ? p.totalP1 : '-'}</p></div>
                  <div class="w-px h-8 bg-slate-200"></div>
                  <div class="text-center"><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Skor P2</p><p class="font-black text-slate-700 text-xl">${p.totalP2 !== null ? p.totalP2 : '-'}</p></div>
                  <div class="w-px h-8 bg-slate-200"></div>
                  <div class="text-center"><p class="text-[10px] font-black text-brand uppercase tracking-widest mb-1">Purata</p><p class="font-black text-brand text-2xl">${p.purata !== null ? p.purata.toFixed(1) : '-'}</p></div>
                </div>
                <button onclick="app.paparModalLaporan(${idx})" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold py-3.5 rounded-2xl transition-all shadow-md active:scale-95">Buka Analitik Laporan</button>
              </div>
            `);
          });
          this.showView('view-pensyarah');
        } catch (e) { alert(e.message); } finally { this.showLoader(false); }
      },

      paparModalLaporan: function(index) {
        const p = this.state.senaraiLaporanPensyarah[index];
        const body = document.getElementById('modal-body');
        
        let html = `
          <div class="flex items-center gap-4 mb-8 bg-slate-50/50 p-5 rounded-[2rem] border border-slate-100">
            <img src="${p.linkGambar || 'https://via.placeholder.com/80?text=ST'}" class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md bg-white">
            <div><h4 class="font-black text-slate-900 text-lg leading-tight mb-1">${p.nama}</h4><p class="text-xs font-bold text-brand uppercase tracking-widest bg-blue-50 w-fit px-2 py-1 rounded-md border border-blue-100">${p.idSistem}</p></div>
          </div>
        `;

        html += `<div class="bg-blue-50/50 p-5 rounded-[2rem] border border-blue-100 mb-6"><h4 class="font-black text-brand text-sm uppercase tracking-widest mb-4 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-brand"></span> Penilai 1 (Jumlah: ${p.totalP1 || '-'})</h4>`;
        if (Object.keys(p.butiranP1).length > 0) {
          CONFIG_KURSUS.kemahiran.forEach(k => {
            if(p.butiranP1[k.id]) {
              // Pengendalian Ralat: Pastikan data wujud sebelum melakukan .replace
              let formatLaporan = (p.butiranP1[k.id].laporan || "").toString().replace(/\n/g, '<br>');
              html += `<div class="mb-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><div class="flex justify-between items-center mb-2"><p class="text-xs font-black text-slate-800 uppercase tracking-widest">${k.nama}</p><span class="font-black text-brand bg-blue-50 px-2 py-1 rounded-lg text-xs">${p.butiranP1[k.id].markah} M</span></div><p class="text-sm font-medium text-slate-600 leading-relaxed">${formatLaporan}</p></div>`;
            }
          });
        } else { html += `<p class="text-sm font-medium text-rose-500 bg-rose-50 p-4 rounded-2xl border border-rose-100">Belum dinilai.</p>`; }
        html += `</div>`;

        html += `<div class="bg-emerald-50/50 p-5 rounded-[2rem] border border-emerald-100 mb-4"><h4 class="font-black text-emerald-600 text-sm uppercase tracking-widest mb-4 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Penilai 2 (Jumlah: ${p.totalP2 || '-'})</h4>`;
        if (Object.keys(p.butiranP2).length > 0) {
          CONFIG_KURSUS.kemahiran.forEach(k => {
            if(p.butiranP2[k.id]) {
              let formatLaporan = (p.butiranP2[k.id].laporan || "").toString().replace(/\n/g, '<br>');
              html += `<div class="mb-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><div class="flex justify-between items-center mb-2"><p class="text-xs font-black text-slate-800 uppercase tracking-widest">${k.nama}</p><span class="font-black text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg text-xs">${p.butiranP2[k.id].markah} M</span></div><p class="text-sm font-medium text-slate-600 leading-relaxed">${formatLaporan}</p></div>`;
            }
          });
        } else { html += `<p class="text-sm font-medium text-rose-500 bg-rose-50 p-4 rounded-2xl border border-rose-100">Belum dinilai.</p>`; }
        html += `</div>`;

        body.innerHTML = html; document.getElementById('modal-laporan').classList.remove('hidden-view');
      },

      tutupModalLaporan: function() { document.getElementById('modal-laporan').classList.add('hidden-view'); },

      logout: function() {
        this.state.sesiSemasa = null; this.state.dataPelajarSemasa = null;
        ['nokp-input', 'login-pin'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('user-info').classList.add('hidden-view'); this.showView('view-login');
      }
    };
  </script>
</body>
</html>
